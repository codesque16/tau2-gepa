name: Deploy GEPA Visualizer to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "web/gepa-visualizer/**"
      - "viz_outputs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/gepa-visualizer/package-lock.json

      - name: Install dependencies
        working-directory: web/gepa-visualizer
        run: npm ci

      - name: Copy dumped visualizer JSONL into site public folder
        run: |
          mkdir -p web/gepa-visualizer/dist/visualizer_dump
          # Copy all visualizer_dump jsonl files from committed viz_outputs into the build output.
          # The viewer serves them from /visualizer_dump/...
          if [ -d gepa/viz_outputs ]; then
            cp -R gepa/viz_outputs/*/visualizer_dump/*.jsonl web/gepa-visualizer/dist/visualizer_dump/ 2>/dev/null || true
          fi

      - name: Build
        working-directory: web/gepa-visualizer
        env:
          NODE_ENV: production
          GITHUB_PAGES_BASE: /
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/gepa-visualizer/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

