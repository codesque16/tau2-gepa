# Publishes examples/run_output_viewer/ plus committed viz data so the run dropdown works on Pages.
# Commit viz_outputs/ (and push) so CI can copy it into the site; gen_outputs_manifest.py runs in CI.
# No Jekyll. Use Settings → Pages → Source: GitHub Actions.
#
# If the live site still shows "GEPA evolution dump viewer", the repo was publishing
# docs/ via "Deploy from a branch". Switch Pages source to GitHub Actions, or push this
# workflow: the default docs index now redirects to run-output-viewer/ for branch deploys.

name: Deploy run output viewer to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site (fail if wrong folder)
        run: |
          set -euo pipefail
          test -f examples/run_output_viewer/index.html
          test -f examples/run_output_viewer/app.js
          grep -q "GEPA run output viewer" examples/run_output_viewer/index.html
          python3 examples/run_output_viewer/gen_outputs_manifest.py
          mkdir -p _site
          cp -r examples/run_output_viewer/. _site/
          if [ -d viz_outputs ]; then
            cp -r viz_outputs _site/
            echo "Bundled viz_outputs/ into site"
          fi
          if [ -d gepa/viz_outputs ]; then
            mkdir -p _site/gepa
            cp -r gepa/viz_outputs _site/gepa/
            echo "Bundled gepa/viz_outputs/ into site"
          fi
          if [ ! -f _site/viz_outputs/manifest.json ] && [ ! -f _site/gepa/viz_outputs/manifest.json ]; then
            echo "::warning::No viz_outputs (or gepa/viz_outputs) in the repo — run list will be empty on Pages. Commit run folders under viz_outputs/ and push."
          fi

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
